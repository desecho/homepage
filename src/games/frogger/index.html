<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frogger</title>
    <script type="module" crossorigin src="/games/frogger/assets/index-DpUP_ig0.js"></script>
    <link rel="stylesheet" crossorigin href="/games/frogger/assets/index-C7RZ4LPl.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="game-title">
        <p class="eyebrow">TypeScript / Vite arcade</p>
        <h1 id="game-title">Frogger</h1>
        <p class="instructions">
          Hop across traffic, ride the river, and fill all five lily pads.
          Move with arrow keys or WASD. Restart with Space or Enter.
        </p>
      </section>

      <section class="cabinet" aria-label="Frogger game">
        <div class="hud" aria-live="polite">
          <span>Score <strong id="score">0</strong></span>
          <span>Lives <strong id="lives">3</strong></span>
          <span>Time <strong id="timer">60</strong></span>
        </div>
        <canvas id="game" width="720" height="624" aria-label="Frogger game board"></canvas>
        <p id="status" class="status">Reach all five lily pads.</p>
      </section>
    </main>

  </body>
</html>
